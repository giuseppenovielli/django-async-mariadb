[tool.poetry]
name = "django-async-mariadb"
version = "5.2.0"
description = "True async Django ORM and MariaDB backend with connection pooling and async transactions"
readme = "README.md"
authors = [
    "Arfey <arfey@gmail.com>",
    "GiuseppeNovieli <novielligiuseppe@gmail.com>",
]
classifiers = [
    "Environment :: Web Environment",
    "Development Status :: 5 - Production/Stable",

    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",

    "Framework :: Django",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Internet",
    "Topic :: Utilities",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries",
]
keywords = [
  "django",
  "asyncio",
  "database",
  "ORM",
]
license = "Apache-2.0"
homepage = "https://github.com/giuseppenovielli/django_async_mariadb"
repository = "https://github.com/giuseppenovielli/django_async_mariadb"

[tool.poetry.dependencies]
python = ">=3.10"
django = ">=5.2,<5.3"
asyncmy = ">=0.2,<0.3"
mysqlclient = { version = ">=2.2,<3", optional = true }
pymysql = { version = ">=1.1,<2", optional = true }

[tool.poetry.extras]
mysqlclient = ["mysqlclient"]
pymysql = ["pymysql"]


[tool.poetry.group.dev.dependencies]
coverage = "^7.13.4"
libcst = "^1.8.6"
pydantic = "^2.12.5"
pyyaml = "^6.0.3"
requests = "^2.32.5"
uvicorn = "^0.38.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
furo = ">=2025.9.25"
myst-parser = "^4"
sphinx = ">=8,<10"
sphinx-autobuild = "^2024.10.3"
sphinx-copybutton = "^0.5.2"
sphinx-design = "^0.6.1"
sphinx-issues = "^5.0.1"
sphinx-sitemap = "^2.9.0"
sphinxext-opengraph = "^0.13.0"
linkify-it-py = "^2"
# 4.x is a deprecated stub that ships no `roman_numerals` module, which
# breaks Sphinx's latex builder import at startup.
roman-numerals-py = "<4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.darker]
line-length = 79

[tool.black]
line-length = 79

[tool.isort]
line_length = 80
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
force_grid_wrap = 2
extend_skip_glob = ["*/migrations/*", "env/*"]

[tool.flake8]
max-line-length = 80
max-complexity = 12
exclude = [
    ".git",
    "env/",
    "django_async_mariadb/db/models/query.py",
    "django_async_mariadb/db/models/base.py",
    "django_async_mariadb/db/models/deletion.py",
    "django_async_mariadb/db/models/sql/compiler.py",
    "django_async_mariadb/db/models/sql/query.py",
    "django_async_mariadb/db/models/sql/subqueries.py",
]
extend-ignore = ["S001"]

[tool.bandit]
exclude_dirs = [
  "env",
  ".cache",
  "tests",
  ".mypy_cache",
  ".django",
  "django_async_mariadb/db/models/query.py",
  "django_async_mariadb/db/models/base.py",
  "django_async_mariadb/db/models/deletion.py",
  "django_async_mariadb/db/models/sql/compiler.py",
  "django_async_mariadb/db/models/sql/query.py",
  "django_async_mariadb/db/models/sql/subqueries.py",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "*.tests.*"
ignore_errors = true

[tool.coverage.run]
omit = [
  "*/test*",
  "test_app/*",
  "manage.py",
]

[tool.coverage.report]
omit = [
  "*/test*",
  "test_app/*",
  "manage.py",
]
